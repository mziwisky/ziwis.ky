<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ziwis.ky</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    canvas, img {
      position: fixed;
      inset: 0;
      display: block;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
    }
    img {
      object-fit: cover;
      /* Fallback when WebGL is unavailable: colour cycling only, no ripple. */
      animation: hue 12s linear infinite;
    }
    @keyframes hue {
      from { filter: saturate(4) contrast(1.2) hue-rotate(0deg); }
      to   { filter: saturate(4) contrast(1.2) hue-rotate(360deg); }
    }
    /* Once WebGL is running, the canvas replaces the plain image. */
    body.gl img { visibility: hidden; animation: none; }
    @media (prefers-reduced-motion: reduce) {
      img { animation: none; }
    }
  </style>
</head>
<body>
  <img id="src" src="scared-mug.jpg" alt="Scared mug">
  <canvas id="c" aria-hidden="true"></canvas>
  <script>
  const trippy = window.trippy = {
    // --- Big wobble: slow, steady, large waves ---
    bigTightness:    4,    // waves per ~1000px of screen. Higher = smaller, tighter waves
    bigAmpMin:       7,   // weakest push, in px
    bigAmpMax:       26,   // strongest push, in px
    bigAmpPeriod:    41,   // seconds per weak -> strong -> weak cycle. 0 = stay at max
    bigSpeed:        0.17, // how fast it morphs. 0 = frozen

    // --- Small wobble: left/right sway in a wave travelling bottom-to-top ---
    waveSpeed:       180,   // px per second the wave travels upward (negative = downward)
    waveLengthMin:   60,   // px from one crest to the next, at its tightest
    waveLengthMax:   110,  // px from one crest to the next, at its loosest
    waveLengthPeriod:7,   // seconds per loose -> tight -> loose cycle. 0 = stay at min
    smallAmpMin:     0,    // weakest push, in px (at the low point of each cycle)
    smallAmpMax:     3,    // strongest push, in px (at the high point of each cycle)
    smallAmpPeriod:  7,    // seconds per full cycle (off stretch + one burst). 0 = stay at max
    smallAmpDuty:    0.80,  // fraction of each cycle the burst lasts (0.2 = on 20%, off 80%).
                           // 1 = a plain smooth rise and fall with no off stretch

    // --- Colour ---
    saturation:      8.0,  // 1 = normal, 0 = greyscale
    contrast:        1.8,  // 1 = normal
    huePeriod:       12,   // seconds per full trip round the colour wheel. 0 = no cycling

    // --- Sway (gentle back-and-forth tilt and zoom) ---
    swayPeriod:      18,   // seconds per full back-and-forth cycle
    swayRotation:    2.5,  // max tilt either way, in degrees
    zoomMin:         1.08, // zoom at rest (keep above ~1.05 so edges stay hidden)
    zoomMax:         1.14, // zoom at the far ends of each tilt
  };

  (() => {
    const canvas = document.getElementById('c');
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) { canvas.remove(); return; }

    const img = document.getElementById('src');
    const gl = canvas.getContext('webgl', { premultipliedAlpha: false });
    if (!gl) { canvas.remove(); return; }

    const vs = `
      attribute vec2 pos;
      void main() { gl_Position = vec4(pos, 0.0, 1.0); }`;

    const fs = `
      precision highp float;
      uniform sampler2D tex;
      uniform vec2 res, imgSize;
      uniform float dpr;
      uniform float bigPhase, bigScale, bigAmp;
      uniform float smallAmp, waveLength, wavePhase;
      uniform float saturation, contrast, hueAngle;
      uniform float rotation, zoom;

      // 3D simplex noise (Ashima Arts / Stefan Gustavson, MIT).
      vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
      vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
      vec4 permute(vec4 x) { return mod289(((x * 34.0) + 1.0) * x); }
      vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }
      float snoise(vec3 v) {
        const vec2 C = vec2(1.0 / 6.0, 1.0 / 3.0);
        const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
        vec3 i  = floor(v + dot(v, C.yyy));
        vec3 x0 = v - i + dot(i, C.xxx);
        vec3 g = step(x0.yzx, x0.xyz);
        vec3 l = 1.0 - g;
        vec3 i1 = min(g.xyz, l.zxy);
        vec3 i2 = max(g.xyz, l.zxy);
        vec3 x1 = x0 - i1 + C.xxx;
        vec3 x2 = x0 - i2 + C.yyy;
        vec3 x3 = x0 - D.yyy;
        i = mod289(i);
        vec4 p = permute(permute(permute(
                  i.z + vec4(0.0, i1.z, i2.z, 1.0))
                + i.y + vec4(0.0, i1.y, i2.y, 1.0))
                + i.x + vec4(0.0, i1.x, i2.x, 1.0));
        float n_ = 0.142857142857;
        vec3 ns = n_ * D.wyz - D.xzx;
        vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
        vec4 x_ = floor(j * ns.z);
        vec4 y_ = floor(j - 7.0 * x_);
        vec4 x = x_ * ns.x + ns.yyyy;
        vec4 y = y_ * ns.x + ns.yyyy;
        vec4 h = 1.0 - abs(x) - abs(y);
        vec4 b0 = vec4(x.xy, y.xy);
        vec4 b1 = vec4(x.zw, y.zw);
        vec4 s0 = floor(b0) * 2.0 + 1.0;
        vec4 s1 = floor(b1) * 2.0 + 1.0;
        vec4 sh = -step(h, vec4(0.0));
        vec4 a0 = b0.xzyw + s0.xzyw * sh.xxyy;
        vec4 a1 = b1.xzyw + s1.xzyw * sh.zzww;
        vec3 p0 = vec3(a0.xy, h.x);
        vec3 p1 = vec3(a0.zw, h.y);
        vec3 p2 = vec3(a1.xy, h.z);
        vec3 p3 = vec3(a1.zw, h.w);
        vec4 norm = taylorInvSqrt(vec4(dot(p0, p0), dot(p1, p1), dot(p2, p2), dot(p3, p3)));
        p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
        vec4 m = max(0.6 - vec4(dot(x0, x0), dot(x1, x1), dot(x2, x2), dot(x3, x3)), 0.0);
        m = m * m;
        return 42.0 * dot(m * m, vec4(dot(p0, x0), dot(p1, x1), dot(p2, x2), dot(p3, x3)));
      }

      vec3 hueRotate(vec3 c, float a) {
        // Rotate chroma in YIQ space.
        const mat3 toYIQ = mat3(0.299, 0.596, 0.211,
                                0.587, -0.274, -0.523,
                                0.114, -0.322, 0.312);
        const mat3 toRGB = mat3(1.0, 1.0, 1.0,
                                0.956, -0.272, -1.106,
                                0.621, -0.647, 1.703);
        vec3 yiq = toYIQ * c;
        float s = sin(a), co = cos(a);
        yiq.yz = mat2(co, s, -s, co) * yiq.yz;
        return toRGB * yiq;
      }

      void main() {
        // Big wobble: 3D noise in screen space, with an ever-increasing phase
        // as the third axis, so the pattern morphs steadily and never plays
        // back in reverse.
        vec2 px = gl_FragCoord.xy / dpr;
        vec3 B = vec3(px * bigScale, bigPhase);
        vec2 big = vec2(snoise(B), snoise(B + vec3(31.7, 11.3, 0.0)));
        // Small wobble: horizontal-only displacement whose crests travel up
        // the screen (gl_FragCoord.y counts from the bottom). Measured from
        // mid-screen so wavelength changes stretch evenly from the centre.
        vec2 small = vec2(sin(6.2831853 * ((px.y - 0.5 * res.y / dpr) / waveLength - wavePhase)), 0.0);
        vec2 frag = gl_FragCoord.xy + (big * bigAmp + small * smallAmp) * dpr;

        // Sway: rotate and zoom about the screen centre.
        vec2 c = frag - 0.5 * res;
        float s = sin(rotation), co = cos(rotation);
        c = mat2(co, s, -s, co) * c / zoom;

        // object-fit: cover
        float scale = max(res.x / imgSize.x, res.y / imgSize.y);
        vec2 uv = c / (imgSize * scale);
        uv.y = -uv.y;
        uv += 0.5;

        vec3 col = texture2D(tex, clamp(uv, 0.0, 1.0)).rgb;
        float luma = dot(col, vec3(0.2126, 0.7152, 0.0722));
        col = mix(vec3(luma), col, saturation);
        col = (col - 0.5) * contrast + 0.5;
        col = hueRotate(col, hueAngle);
        gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
      }`;

    function shader(type, src) {
      const s = gl.createShader(type);
      gl.shaderSource(s, src);
      gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
      return s;
    }

    function start() {
      const prog = gl.createProgram();
      gl.attachShader(prog, shader(gl.VERTEX_SHADER, vs));
      gl.attachShader(prog, shader(gl.FRAGMENT_SHADER, fs));
      gl.linkProgram(prog);
      if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
      gl.useProgram(prog);

      gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
      const loc = gl.getAttribLocation(prog, 'pos');
      gl.enableVertexAttribArray(loc);
      gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

      gl.bindTexture(gl.TEXTURE_2D, gl.createTexture());
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      // Throws a SecurityError when the page is opened via file:// in Chrome.
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, img);

      const u = {};
      for (const name of ['res', 'imgSize', 'dpr', 'bigPhase', 'bigScale', 'bigAmp',
                          'smallAmp', 'waveLength', 'wavePhase', 'saturation', 'contrast', 'hueAngle', 'rotation', 'zoom']) {
        u[name] = gl.getUniformLocation(prog, name);
      }
      gl.uniform2f(u.imgSize, img.naturalWidth, img.naturalHeight);

      function resize() {
        const dpr = Math.min(devicePixelRatio || 1, 2);
        canvas.width = Math.round(canvas.clientWidth * dpr);
        canvas.height = Math.round(canvas.clientHeight * dpr);
        gl.viewport(0, 0, canvas.width, canvas.height);
        gl.uniform2f(u.res, canvas.width, canvas.height);
        gl.uniform1f(u.dpr, dpr);
      }
      addEventListener('resize', resize);
      resize();

      document.body.classList.add('gl');

      // Each motion keeps its own phase that advances by (elapsed time x speed).
      // That way changing a speed live doesn't make anything jump.
      const TAU = Math.PI * 2;
      let bigPhase = 0, bigAmpTurns = 0, wavePhase = 0, waveLenTurns = 0, smallAmpTurns = 0, hueTurns = 0, swayTurns = 0, last = performance.now();

      (function frame(now) {
        const dt = Math.min((now - last) / 1000, 0.1); // cap so a background tab doesn't lurch
        last = now;
        const k = trippy;

        bigPhase   += dt * k.bigSpeed;
        if (k.waveLengthPeriod > 0) waveLenTurns = (waveLenTurns + dt / k.waveLengthPeriod) % 1;
        // Wavelength eases between max and min (starts at max).
        const waveLength = Math.max(1, k.waveLengthMin + (k.waveLengthMax - k.waveLengthMin) *
          (k.waveLengthPeriod > 0 ? 0.5 + 0.5 * Math.cos(waveLenTurns * TAU) : 0));
        // Phase in wave cycles; advancing by speed / wavelength keeps the
        // crests moving at waveSpeed px/s whatever the current wavelength.
        wavePhase = (wavePhase + dt * k.waveSpeed / waveLength) % 1;
        if (k.bigAmpPeriod > 0) bigAmpTurns = (bigAmpTurns + dt / k.bigAmpPeriod) % 1;
        if (k.smallAmpPeriod > 0) smallAmpTurns = (smallAmpTurns + dt / k.smallAmpPeriod) % 1;
        if (k.huePeriod > 0)  hueTurns  = (hueTurns  + dt / k.huePeriod)  % 1;
        if (k.swayPeriod > 0) swayTurns = (swayTurns + dt / k.swayPeriod) % 1;

        // Tilt swings left/right once per period. Zoom peaks at each
        // tilt extreme and relaxes at centre (as in the original CSS).
        const rotation = k.swayRotation * Math.PI / 180 * Math.sin(swayTurns * TAU);
        const zoom = k.zoomMin + (k.zoomMax - k.zoomMin) * (0.5 - 0.5 * Math.cos(swayTurns * 2 * TAU));

        // Small-wobble strength: sits at min for the first (1 - duty) of each
        // cycle, then swells up to max and back down in one smooth burst.
        let smallSwing = 1;
        if (k.smallAmpPeriod > 0) {
          const duty = Math.min(Math.max(k.smallAmpDuty, 0.01), 1);
          const into = (smallAmpTurns - (1 - duty)) / duty; // 0..1 across the burst
          smallSwing = into < 0 ? 0 : 0.5 - 0.5 * Math.cos(into * TAU);
        }

        gl.uniform1f(u.bigPhase, bigPhase);
        gl.uniform1f(u.bigScale, k.bigTightness / 1000);
        // Big-wobble strength eases smoothly between min and max (starts at min).
        const bigSwing = k.bigAmpPeriod > 0 ? 0.5 - 0.5 * Math.cos(bigAmpTurns * TAU) : 1;
        gl.uniform1f(u.bigAmp, k.bigAmpMin + (k.bigAmpMax - k.bigAmpMin) * bigSwing);
        gl.uniform1f(u.waveLength, waveLength);
        gl.uniform1f(u.wavePhase, wavePhase);
        gl.uniform1f(u.smallAmp, k.smallAmpMin + (k.smallAmpMax - k.smallAmpMin) * smallSwing);
        gl.uniform1f(u.saturation, k.saturation);
        gl.uniform1f(u.contrast, k.contrast);
        gl.uniform1f(u.hueAngle, hueTurns * TAU);
        gl.uniform1f(u.rotation, rotation);
        gl.uniform1f(u.zoom, zoom);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        requestAnimationFrame(frame);
      })(last);
    }

    function tryStart() {
      try { start(); }
      catch (e) { console.warn('Ripple effect disabled:', e); canvas.remove(); }
    }
    if (img.complete && img.naturalWidth) tryStart();
    else img.addEventListener('load', tryStart);
  })();
  </script>
</body>
</html>
