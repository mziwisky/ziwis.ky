<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ziwis.ky</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    .trip {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      /* Colour cycling lives on the wrapper so it can blend smoothly. */
      animation: hue 11s linear infinite;
    }
    svg {
      display: block;
      width: 100%;
      height: 100%;
      animation: breathe 17s ease-in-out infinite;
    }
    @keyframes hue {
      from { filter: saturate(8) contrast(1.0) hue-rotate(0deg); }
      to   { filter: saturate(8) contrast(1.0) hue-rotate(360deg); }
    }
    @keyframes breathe {
      0%, 100% { transform: scale(1.08) rotate(0deg); }
      25%      { transform: scale(1.14) rotate(1.5deg); }
      50%      { transform: scale(1.10) rotate(0deg); }
      75%      { transform: scale(1.14) rotate(-1.5deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .trip, svg { animation: none; filter: none; transform: none; }
      svg animateTransform { display: none; }
    }
  </style>
</head>
<body>
  <!--
    Forward-only warp.
    feTurbulence noise is pinned to the coordinate space of the element the
    filter is on. So each warp layer is a group that slides steadily in one
    direction, holding an inner group that slides back by exactly the same
    amount: the photo stays put, but the noise glides across it. Two layers
    sliding different ways overlap into a pattern that keeps morphing, and
    since each one only ever moves forward, it never reverses.

    To tweak:
      - speed: the slide distance / dur on each pair of animateTransforms
        (both in a pair must match, or the photo itself will drift)
      - wave size: baseFrequency (smaller = bigger waves)
      - strength: the values="min; max; min" on each feDisplacementMap's
        animate, and its dur (seconds per weak -> strong -> weak cycle).
        The two layers use different durs so they rarely peak together.
  -->
  <div class="trip">
    <svg aria-label="Scared mug" role="img">
      <defs>
        <filter id="waveA" x="-10%" y="-10%" width="120%" height="120%">
          <feTurbulence type="fractalNoise" baseFrequency="0.004 0.008" numOctaves="2" seed="3" result="noise"/>
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="20" xChannelSelector="R" yChannelSelector="G">
            <!-- strength eases between 20 and 60 and back -->
            <animate attributeName="scale" values="20; 60; 20" dur="13s" repeatCount="indefinite"
                     calcMode="spline" keyTimes="0; 0.5; 1" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>
          </feDisplacementMap>
        </filter>
        <filter id="waveB" x="-10%" y="-10%" width="120%" height="120%">
          <feTurbulence type="fractalNoise" baseFrequency="0.008 0.004" numOctaves="2" seed="11" result="noise"/>
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="20" xChannelSelector="R" yChannelSelector="G">
            <!-- strength eases between 20 and 60 and back -->
            <animate attributeName="scale" values="20; 60; 20" dur="17s" repeatCount="indefinite"
                     calcMode="spline" keyTimes="0; 0.5; 1" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>
          </feDisplacementMap>
        </filter>
      </defs>

      <!-- Layer A: noise drifts up-left at ~30 px/s (loops after ~2 hours) -->
      <g filter="url(#waveA)">
        <animateTransform attributeName="transform" type="translate"
                          from="0 0" to="-200000 -140000" dur="6667s" repeatCount="indefinite"/>
        <g>
          <animateTransform attributeName="transform" type="translate"
                            from="0 0" to="200000 140000" dur="6667s" repeatCount="indefinite"/>

          <!-- Layer B: noise drifts down-right, a bit slower -->
          <g filter="url(#waveB)">
            <animateTransform attributeName="transform" type="translate"
                              from="0 0" to="120000 160000" dur="8000s" repeatCount="indefinite"/>
            <g>
              <animateTransform attributeName="transform" type="translate"
                                from="0 0" to="-120000 -160000" dur="8000s" repeatCount="indefinite"/>
              <image href="scared-mug.jpg" width="100%" height="100%"
                     preserveAspectRatio="xMidYMid slice"/>
            </g>
          </g>
        </g>
      </g>
    </svg>
  </div>
</body>
</html>
